
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CA Desk — Professional Toolkit</title>
<style>
  :root{
    --navy:#0f2a4a;
    --navy-dark:#0a1d33;
    --gold:#c9971f;
    --gold-light:#e0b84a;
    --cream:#f4ecdd;
    --cream-card:#faf5ea;
    --text-dark:#1c2b3a;
    --text-muted:#6b6055;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Georgia','Times New Roman',serif;
    background:var(--cream);
    color:var(--text-dark);
    display:flex;
    justify-content:center;
  }
  .page{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--cream);
  }

  /* Header */
  .header{
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy-dark) 100%);
    color:#fff;
    padding:12px 16px 12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .app-icon{
    width:38px;height:38px;
    border-radius:11px;
    flex-shrink:0;
    box-shadow:0 2px 5px rgba(0,0,0,0.25);
    display:block;
    object-fit:cover;
  }
  .header-text h1{
    font-size:16px;
    font-weight:700;
    line-height:1.1;
  }
  .header-text .subtitle{
    font-size:8.5px;
    letter-spacing:1.5px;
    color:#c7d2de;
    margin-top:1px;
    font-family:Arial,Helvetica,sans-serif;
  }
  .tagline{
    font-style:italic;
    font-size:10.5px;
    color:#e7dcc2;
    margin-top:6px;
    line-height:1.3;
  }

  /* Body */
  .body{
    flex:1;
    padding:10px 14px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .get-started{
    background:var(--cream-card);
    border-left:4px solid #8a2f2f;
    border-radius:10px;
    padding:9px 12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .get-started .label{
    font-family:Arial,Helvetica,sans-serif;
    font-size:8.5px;
    letter-spacing:1.2px;
    color:var(--text-muted);
    font-weight:700;
  }
  .get-started p{
    font-size:11px;
    line-height:1.3;
    margin-top:2px;
  }
  .get-started .icon{
    width:32px;height:32px;
    background:#f4d9d9;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    flex-shrink:0;
  }

  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .stat-card{
    background:var(--cream-card);
    border-radius:9px;
    padding:7px 12px;
  }
  .stat-card .label{
    font-family:Arial,Helvetica,sans-serif;
    font-size:8.5px;
    letter-spacing:1.2px;
    color:var(--text-muted);
    font-weight:700;
  }
  .stat-card .value{
    font-size:14px;
    font-weight:700;
    color:var(--navy);
    margin-top:1px;
  }

  .features{
    background:var(--cream-card);
    border-radius:9px;
    padding:2px 14px;
    display:flex;
    flex-direction:column;
  }
  .feature-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 0;
    font-size:11px;
    font-family:Arial,Helvetica,sans-serif;
  }
  .feature-row:not(:last-child){
    border-bottom:1px solid rgba(0,0,0,0.06);
  }
  .feature-row .emoji{
    width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;
    flex-shrink:0;
  }

  .version{
    text-align:center;
    font-family:Arial,Helvetica,sans-serif;
    font-size:9.5px;
    color:var(--text-muted);
  }

  .download-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:linear-gradient(160deg,var(--navy),var(--navy-dark));
    color:#fff;
    text-decoration:none;
    font-family:Arial,Helvetica,sans-serif;
    font-weight:700;
    font-size:13px;
    padding:10px;
    border-radius:9px;
    box-shadow:0 4px 10px rgba(15,42,74,0.3);
  }
  .download-note{
    text-align:center;
    font-family:Arial,Helvetica,sans-serif;
    font-size:9px;
    color:var(--text-muted);
    line-height:1.3;
    padding:0 6px;
  }

  .share{
    background:var(--cream-card);
    border-radius:9px;
    padding:9px 12px;
  }
  .share .label{
    font-family:Arial,Helvetica,sans-serif;
    font-size:8.5px;
    letter-spacing:1.2px;
    color:var(--text-muted);
    font-weight:700;
    display:flex;
    align-items:center;
    gap:5px;
    margin-bottom:6px;
  }
  .share-row{
    display:flex;
    gap:6px;
  }
  .share-input{
    flex:1;
    display:flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border-radius:7px;
    padding:0 8px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:9.5px;
    color:var(--text-dark);
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .copy-btn{
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:7px;
    padding:0 12px;
    font-family:Arial,Helvetica,sans-serif;
    font-weight:700;
    font-size:10.5px;
    cursor:pointer;
    display:flex;align-items:center;gap:5px;
    transition:background 0.2s;
  }
  .copy-btn.copied{background:#2f7a45;}
</style>
</head>
